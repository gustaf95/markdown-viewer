appId: com.gustaf95.markdownviewer
productName: Markdown Viewer
copyright: Copyright © 2026 gustaf95

directories:
  output: release
  buildResources: assets

files:
  - dist/**
  - package.json

asar: true

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Markdown Viewer

portable:
  artifactName: "MarkdownViewer-${version}-portable.exe"

# name 은 Windows 레지스트리의 ProgID(파일 클래스)로 그대로 쓰이므로 영문 식별자,
# 탐색기에 표시되는 이름은 description 이다.
fileAssociations:
  - ext: md
    name: MarkdownViewer.md
    description: Markdown 문서
    icon: icon.ico
    role: Viewer
  - ext: markdown
    name: MarkdownViewer.markdown
    description: Markdown 문서
    icon: icon.ico
    role: Viewer
